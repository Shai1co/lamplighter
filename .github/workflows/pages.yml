# Build the static bundle and publish it to GitHub Pages on every push to
# master. The Pages build is the pure static dist/: every story in /stories
# plays (Lumen and the shipped generated example included); the in-app
# Create-a-Story flow needs a dev/preview server behind the page and is
# hidden on Pages by design — see README "Story generation (server-side)".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # enablement: true switches Pages on for the repo (build_type: workflow)
      # the first time this runs, so no manual Settings → Pages step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
