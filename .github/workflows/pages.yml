# Build the static bundle and publish it to the gh-pages branch on every push
# to master. Pages serves that branch (auto-enabled on public repos by the
# branch's first push; source: Settings → Pages → gh-pages if it ever needs
# re-selecting). The branch-publish route is used instead of
# actions/deploy-pages because creating the Pages site via the workflow token
# fails with "Resource not accessible by integration" on this repo — the
# gh-pages branch needs only `contents: write`, which the token does have.
#
# The Pages build is the pure static dist/: every story in /stories plays
# (Lumen and the shipped generated example included); the in-app
# Create-a-Story flow needs a dev/preview server behind the page and is
# hidden on a static host by design — see README "Story generation".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages runs the branch through Jekyll unless told not to; .nojekyll
      # keeps it serving dist/ verbatim.
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
